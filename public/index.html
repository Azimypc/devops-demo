<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Demo Landing Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      padding: 48px 32px;
      max-width: 420px;
      text-align: center;
    }
    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 2.8rem;
      margin-bottom: 16px;
      letter-spacing: 2px;
    }
    p {
      font-size: 1.2rem;
      margin-bottom: 32px;
      color: #e0e0e0;
    }
    .cta-btn {
      background: #ff9800;
      color: #fff;
      border: none;
      border-radius: 30px;
      padding: 14px 36px;
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 4px 16px rgba(255,152,0,0.2);
    }
    .cta-btn:hover {
      background: #fb8c00;
    }
    .logo {
      width: 80px;
      margin-bottom: 24px;
      filter: drop-shadow(0 2px 8px rgba(30,60,114,0.2));
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="https://cdn-icons-png.flaticon.com/512/5969/5969020.png" alt="DevOps Logo">
    <h1>Welcome to DevOps Demo</h1>
    <p>Build, deploy, and scale your applications with ease.<br>Experience the power of modern DevOps practices!</p>
    <a href="#" class="cta-btn">Get Started</a>
  </div>
</body>
</html>
